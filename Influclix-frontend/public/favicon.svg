<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Same gradient as the Navbar SparkleIcon -->
    <linearGradient id="sparkleGradient" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#00a36c" />
    </linearGradient>
  </defs>

  <!-- The mint-green rounded square (mirrors brand-icon-wrapper) -->
  <rect width="32" height="32" rx="9" fill="#e6fcf1" />

  <!-- The sparkle inside (mirrors brand-sparkle-icon) -->
  <path 
    d="M16 6 L18.5 13.5 L26 16 L18.5 18.5 L16 26 L13.5 18.5 L6 16 L13.5 13.5 Z" 
    fill="url(#sparkleGradient)" 
  />
</svg>